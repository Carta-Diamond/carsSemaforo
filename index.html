<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main">
        <audio id="musica" src="audio/highway.mp3" loop></audio>
        <button id="btnMusica">🔊</button>
        <div class="container">
        <section class="traffic-section">
            <h2>Semáforo</h2>
                <div class="traffic-light" id="trafficLight">
                <div class="red-light" id="red-light"></div>
                <div class="yellow-light" id="yellow-light"></div>
                <div class="green-light" id="green-light"></div>
            </div>
        </section>

        <section class="controls">
            <div class="button-group">
                <h2>Modo Automático</h2>
                <button id="btnAutomatico">Cambiar Color</button>
                <button id="btnStop">Detener</button>
            </div>
            <div>
                <h2>Modo Manual</h2>
                <button id="red">Cambiar a Rojo</button>
                <button id="yellow">Cambiar a Amarillo</button>
                <button id="green">Cambiar a Verde</button>
                <button id="off">Apagar</button>
            </div>
            
        </section>
        </div>

        <section class="counter-container">
            <h2>Conteo de Luces</h2>
            <div class="counter-row">
                <div class="circle red"></div>
                <span id="redCount">0 veces</span>
            </div>
            <div class="counter-row">
                <div class="circle yellow"></div>
                <span id="yellowCount">0 veces</span>
            </div>
            <div class="counter-row">
                <div class="circle green"></div>
                <span id="greenCount">0 veces</span>
            </div>
        </section>
    </main>
    <script src="js/scripts.js"></script>
</body>
</html>
